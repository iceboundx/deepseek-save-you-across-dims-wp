[project]
name = "deepseek-save-you-across-dims-wp"
version = "1.0.0"
description = "Offline build of the DeepSeek live wallpaper I'll Cross Dimensions to Save You"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.5",
    "opencv-python-headless==5.1.0.95",
    "moderngl==5.13.0",
    "glcontext==3.1.0",
    "pillow==12.0.0",
    "imageio-ffmpeg==0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whale = ["shaders/*.vert", "shaders/*.frag", "shaders/*.glsl", "shaders/glitch/*.glsl", "bake/*.cjs"]
